# Belongs in the APP repo (SparknetTask1), not this infra repo -
# .github/workflows/ci-cd.yml there. Included here so the pipeline ships
# alongside the infra that defines what it deploys to.
#
# Flow: detect which of backend/frontend changed -> build, Trivy-scan,
# push each changed image to ECR tagged by commit SHA -> register a new
# ECS task-definition revision for each changed service -> force a new
# deployment -> wait for it to go stable. Terraform never re-applies
# `container_definitions` after the first `apply` (see modules/ecs/main.tf),
# so this workflow and `terraform apply` never race each other.
# FIXED: paths and docker build contexts pointed at top-level backend/ and
# frontend/ folders, which don't exist in this repo - the app actually lives
# under app/backend and app/frontend. As written before this fix, the
# paths-filter step never matched a change (so build/deploy jobs never ran),
# and even a manual run would fail at `docker build ... ./backend` with
# "no such file or directory".
name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write   # required for AWS OIDC auth - no access keys in secrets
  contents: read

env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: awsinfra-cluster
  # Set these to the outputs from `terraform output` in the infra repo:
  # AWS_DEPLOY_ROLE_ARN            <- github_actions_deploy_role_arn
  # BACKEND_ECR_REPOSITORY          <- backend_ecr_repository_name
  # FRONTEND_ECR_REPOSITORY         <- frontend_ecr_repository_name
  # BACKEND_TASK_FAMILY              <- backend_task_family
  # FRONTEND_TASK_FAMILY             <- frontend_task_family
  # BACKEND_SERVICE                  <- backend_service_name
  # FRONTEND_SERVICE                 <- frontend_service_name
  BACKEND_ECR_REPOSITORY: luggage-bag-app
  FRONTEND_ECR_REPOSITORY: luggage-bag-app-frontend
  BACKEND_TASK_FAMILY: awsinfra-backend
  FRONTEND_TASK_FAMILY: awsinfra-frontend
  BACKEND_SERVICE: awsinfra-backend-service
  FRONTEND_SERVICE: awsinfra-frontend-service

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'app/backend/**'
            frontend:
              - 'app/frontend/**'

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build -t "$BACKEND_ECR_REPOSITORY:${{ github.sha }}" ./app/backend

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "${{ env.BACKEND_ECR_REPOSITORY }}:${{ github.sha }}"
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1" # fail the build on critical/high CVEs

      - name: Tag and push to ECR
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$BACKEND_ECR_REPOSITORY:${{ github.sha }}"
          docker tag "$BACKEND_ECR_REPOSITORY:${{ github.sha }}" "$IMAGE"
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        # REACT_APP_API_URL is baked in at build time (nginx serves a static
        # bundle, no runtime env injection possible). FIXED: this used to be
        # "/api", but apiConfig.js and CheckoutPage.jsx already append
        # "/api/orders" to this value - "/api" + "/api/orders" baked in
        # "/api/api/orders", a 404. Empty string = relative "/api/orders",
        # which resolves against the ALB's own origin and gets path-routed
        # to the backend target group (see modules/alb) - same-origin, so no
        # CORS setup is needed either.
        run: |
          docker build \
            --build-arg REACT_APP_API_URL= \
            -t "$FRONTEND_ECR_REPOSITORY:${{ github.sha }}" ./app/frontend

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "${{ env.FRONTEND_ECR_REPOSITORY }}:${{ github.sha }}"
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Tag and push to ECR
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$FRONTEND_ECR_REPOSITORY:${{ github.sha }}"
          docker tag "$FRONTEND_ECR_REPOSITORY:${{ github.sha }}" "$IMAGE"
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy-backend:
    needs: build-backend
    if: needs.build-backend.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register new task def revision and roll the service
        run: |
          chmod +x ./scripts/deploy-ecs-service.sh
          ./scripts/deploy-ecs-service.sh \
            "$ECS_CLUSTER" \
            "$BACKEND_SERVICE" \
            "$BACKEND_TASK_FAMILY" \
            backend \
            "${{ needs.build-backend.outputs.image }}"

  deploy-frontend:
    needs: build-frontend
    if: needs.build-frontend.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register new task def revision and roll the service
        run: |
          chmod +x ./scripts/deploy-ecs-service.sh
          ./scripts/deploy-ecs-service.sh \
            "$ECS_CLUSTER" \
            "$FRONTEND_SERVICE" \
            "$FRONTEND_TASK_FAMILY" \
            frontend \
            "${{ needs.build-frontend.outputs.image }}"
