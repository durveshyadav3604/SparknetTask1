server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: if the requested path isn't a real file (e.g. /shop,
    # /checkout, /product/123), serve index.html instead of nginx's own 404.
    # React Router then reads the URL client-side and renders the right view.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache index.html itself, so deploys are picked up immediately
    # instead of a stale cached shell loading an old JS bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
